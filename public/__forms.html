<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"></head>
<body>
<!-- Netlify scans this static form at deploy time. The React form on /order submits here. -->
<form name="team-kit-order" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="team-kit-order" />
  <input type="hidden" name="subject" value="Caledon United 2018 Girls — Team Kit Order Request" />
  <input type="text" name="bot-field" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="player_first_name" />
  <input type="text" name="jersey_name" />
  <input type="text" name="jersey_number" />
  <input type="text" name="items_requested" />
  <input type="text" name="home_jersey_size" />
  <input type="text" name="home_shorts_size" />
  <input type="text" name="home_socks_size" />
  <input type="text" name="away_jersey_size" />
  <input type="text" name="away_shorts_size" />
  <input type="text" name="away_socks_size" />
  <input type="text" name="track_jacket_size" />
  <input type="text" name="track_pants_size" />
  <input type="text" name="outdoor_jacket_size" />
  <input type="text" name="backpack_initials" />
  <textarea name="order_details"></textarea>
  <textarea name="notes"></textarea>
  <input type="checkbox" name="request_ack" />
</form>
</body>
</html>
