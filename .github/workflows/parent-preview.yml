name: Parent Information Preview
on:
  push:
    branches: [codex/u9-season-overview-preview]
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/codex/u9-season-overview-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: npm install
      - run: node scripts/test-management.cjs
      - run: npm run build
      - name: Publish draft preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 2b01d84c-f2eb-4e6d-a486-0546ffcac16e
        run: npx --yes netlify-cli@latest deploy --build --context deploy-preview --json --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" > preview.json
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-preview
          path: preview.json
      - name: Show preview URL
        run: node -e "const p=require('./preview.json'); console.log(p.deploy_url); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Preview '+p.deploy_url)"
