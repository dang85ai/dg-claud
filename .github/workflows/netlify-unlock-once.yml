name: Netlify Unlock Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/netlify-unlock-once.yml"

jobs:
  unlock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Unlock current production deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          LOCKED_DEPLOY_ID: 6ac1c85c6ca02c1b0ed7f961
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/deploys/$LOCKED_DEPLOY_ID/unlock" \
            > /dev/null
