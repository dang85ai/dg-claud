name: Generate Admin Activation Link

on:
  push:
    paths:
      - ".github/workflows/bootstrap-admin-invite.yml"

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Generate one-time admin activation link
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://sgoxywyhaketjmdmkzhm.supabase.co/functions/v1/generate-admin-activation-link"
