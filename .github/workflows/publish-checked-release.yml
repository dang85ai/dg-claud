name: Publish checked U9 release
on:
  push:
    branches: [codex/u9-production-release-2026-10-02]
    paths: [.github/workflows/publish-checked-release.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Publish verified Netlify deployment
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@latest api restoreSiteDeploy --data '{"site_id":"2b01d84c-f2eb-4e6d-a486-0546ffcac16e","deploy_id":"6abf374c1542769dc5c86ddb"}' > production.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('production.json','utf8')); if(d.id!=='6abf374c1542769dc5c86ddb'||d.state!=='ready') throw new Error('Unexpected production deployment'); console.log(JSON.stringify({id:d.id,state:d.state,url:d.ssl_url}));"
